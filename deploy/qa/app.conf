# /opt/go/gocreate-qa/deploy/app.conf — configuracion de deploy-app.sh para el QA.
# Se instala con alta_host.sh (dueño root:wheel, igual que el de produccion).
# Mismo formato que /opt/go/gocreate/deploy/app.conf; solo cambia lo marcado «QA».
# (Este archivo lo hace `source` bash: no poner comentarios al final de una linea
# que lleve comillas o parentesis.)

# QA: slug propio => /opt/go/gocreate-qa y com.go.gocreate-qa.*
APP_NAME=gocreate-qa
# QA: usuario de servicio propio (NO _gocreate)
SERVICE_USER=_gocreateqa
SERVICE_LABEL=com.go.gocreate-qa.api
REPO_URL=https://github.com/integracionesia-maker/Ready2Go.git
# QA: rama `qa` (ver README: `git push origin <rama>:qa`)
BRANCH=qa
# QA: puerto exclusivo (8000 prod, 8001, 8003 requis y 8004 plazamadero ocupados)
PORT=8010
HEALTH_PATH=/api/health
PYTHON_BIN=/opt/homebrew/opt/python@3.12/bin/python3.12
BACKEND_SUBDIR=backend
REQUIREMENTS=backend/requirements.txt
FRONTEND_DIR=frontend
# QA: el build lleva la bandera de entorno (banner y titulo [QA])
NPM_BUILD_CMD="VITE_APP_ENV=qa npm run build"
ENV_FILE=backend/.env
DATA_LINKS=("backend/presupuesto.db:shared/data/presupuesto.db" "backend/uploads:shared/data/uploads")
KEEP_RELEASES=2
# QA: solo datos ficticios, el respaldo importa poco
BACKUP_KEEP=2
